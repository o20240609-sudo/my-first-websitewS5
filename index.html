<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>墨光行旅 | 獨立書店與手帳文具舖</title>
  <style>
    :root {
      --primary: #2c3e50;
      --primary-dark: #1a252f;
      --accent: #d35400;
      --danger: #c0392b;
      --bg-color: #f5f3ef;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-light: #7f8c8d;
      --border-color: #dcdde1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
    
    /* 頂部導覽列 */
    header {
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(44, 62, 80, 0.06);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo-container { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .logo-icon { font-size: 1.8rem; }
    .logo-text h1 { font-size: 1.3rem; font-weight: 700; color: var(--primary); letter-spacing: 1px; }
    .logo-text p { font-size: 0.75rem; color: var(--text-light); }

    .cart-icon-btn {
      position: relative;
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(44, 62, 80, 0.2);
    }
    .cart-icon-btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
    .cart-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--danger);
      color: white;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
      border: 2px solid white;
    }

    .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; flex: 1; width: 100%; }

    /* 頁面切換控制 */
    .page { display: none; }
    .page.active { display: block; animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* 頁面標題區 */
    .section-header { text-align: center; margin-bottom: 30px; }
    .section-header h2 { font-size: 2rem; color: var(--primary); margin-bottom: 8px; font-weight: 700; }
    .section-header p { color: var(--text-light); font-size: 0.95rem; }

    /* 選品列表頁 - Flexbox 排版 */
    .product-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(44, 62, 80, 0.05);
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s;
      text-align: left;
      width: 240px;
      flex-shrink: 0;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .product-card:hover { transform: translateY(-6px); box-shadow: 0 12px 30px rgba(44, 62, 80, 0.12); }
    .product-img-wrap { width: 100%; height: 180px; overflow: hidden; background: #eee; }
    .product-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
    .product-card:hover img { transform: scale(1.05); }
    
    .product-content { padding: 16px; display: flex; flex-direction: column; flex: 1; justify-content: space-between; }
    .product-card h3 { font-size: 1.05rem; margin-bottom: 8px; color: var(--text-main); font-weight: 600; }
    .product-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .product-card .price { color: var(--accent); font-weight: 700; font-size: 1.1rem; }
    .view-detail-hint { font-size: 0.8rem; color: var(--primary); font-weight: 600; }

    /* Media Query: 螢幕寬度小於 768px 時改為直向堆疊 */
    @media (max-width: 768px) {
      header { padding: 12px 16px; }
      .product-grid { flex-direction: column; align-items: center; gap: 16px; }
      .product-card { width: 100%; max-width: 380px; }
    }

    /* 商品詳情頁 */
    .detail-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 35px;
      box-shadow: 0 10px 30px rgba(44, 62, 80, 0.08);
      max-width: 750px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      border: 1px solid var(--border-color);
    }
    @media (max-width: 768px) {
      .detail-card { grid-template-columns: 1fr; padding: 20px; }
    }
    .detail-card img { width: 100%; height: 320px; object-fit: cover; border-radius: 10px; }
    .detail-info { display: flex; flex-direction: column; justify-content: space-between; }
    .detail-info h2 { font-size: 1.8rem; margin-bottom: 8px; color: var(--text-main); }
    .detail-info .price { font-size: 1.4rem; color: var(--accent); font-weight: bold; margin-bottom: 15px; }
    .detail-info p { font-size: 0.95rem; color: var(--text-light); margin-bottom: 10px; line-height: 1.6; }
    .detail-info strong { color: var(--text-main); }
    
    .option-group { margin: 15px 0; }
    .option-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; color: var(--text-main); }
    .option-group select, .option-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fafafa;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }
    .option-group select:focus, .option-group input:focus { border-color: var(--primary); background: #fff; }

    /* 通用按鈕樣式 */
    .btn {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 15px;
      font-weight: 600;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(44, 62, 80, 0.2);
    }
    .btn:hover { background-color: var(--primary-dark); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-secondary { background-color: #b2bec3; color: #2d3436; margin-top: 8px; box-shadow: none; }
    .btn-secondary:hover { background-color: #636e72; }

    /* Modal 彈窗 (購物車 & 結帳) */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(44, 62, 80, 0.5);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 15px;
    }
    .modal.active { display: flex; animation: fadeIn 0.2s ease-out; }
    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 520px;
      border-radius: 16px;
      padding: 24px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      border: 1px solid var(--border-color);
    }
    .modal-header {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-main);
    }
    .edit-toggle-btn {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 5px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .edit-toggle-btn:hover { background: var(--primary); color: white; }
    .edit-toggle-btn.editing {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
    }
    
    /* 購物車項目列表 */
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px dashed var(--border-color);
    }
    .cart-item-info { font-size: 0.95rem; font-weight: 600; color: var(--text-main); }
    .cart-item-sub { font-size: 0.82rem; color: var(--text-light); margin-top: 3px; }

    /* 編輯控制按鈕 */
    .qty-controls { display: flex; align-items: center; gap: 8px; }
    .qty-btn {
      background: #f1f5f9;
      border: 1px solid var(--border-color);
      width: 30px;
      height: 30px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      transition: background 0.2s;
    }
    .qty-btn:hover { background: #e2e8f0; }
    .delete-item-btn {
      background: #fee2e2;
      color: #991b1b;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      margin-right: 10px;
      transition: background 0.2s;
    }
    .delete-item-btn:hover { background: #fecaca; }

    /* 表單元件 */
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fafafa;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--primary);
      background: #fff;
    }
    .error-text {
      color: var(--danger);
      font-size: 0.8rem;
      margin-top: 5px;
      display: none;
      font-weight: 500;
    }
    .total-amount { font-size: 1.3rem; font-weight: 700; color: var(--accent); text-align: right; margin: 20px 0; }

    /* 頁尾 */
    footer {
      background: #ffffff;
      border-top: 1px solid var(--border-color);
      text-align: center;
      padding: 20px;
      color: var(--text-light);
      font-size: 0.85rem;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <!-- 頂部導覽列 -->
  <header>
    <div class="logo-container" onclick="showPage('pageList')">
      <span class="logo-icon">📚</span>
      <div class="logo-text">
        <h1>墨光行旅</h1>
        <p>獨立書店與手帳文具舖</p>
      </div>
    </div>
    <button class="cart-icon-btn" onclick="openCartModal()">
      🛒 購物車 <span class="cart-badge" id="cartBadge">0</span>
    </button>
  </header>

  <div class="container">
    <!-- 頁面 1: 選品展示頁 -->
    <div id="pageList" class="page active">
      <div class="section-header">
        <h2>獨立出版與精選文具</h2>
        <p>在文字與紙香中尋找生活靈感，品味細緻的手帳時光</p>
      </div>
      <div class="product-grid" id="productGrid"></div>
    </div>

    <!-- 頁面 2: 商品詳情頁 -->
    <div id="pageDetail" class="page">
      <button class="btn btn-secondary" style="width: auto; padding: 8px 16px; margin-bottom: 20px; font-size: 0.9rem;" onclick="showPage('pageList')">← 返回選品列表</button>
      <div class="detail-card">
        <div>
          <img id="detailImg" src="" alt="商品圖片" />
        </div>
        <div class="detail-info">
          <div>
            <h2 id="detailName"></h2>
            <div class="price" id="detailPrice"></div>
            <p><strong>內容介紹：</strong><span id="detailDesc"></span></p>
            <p><strong>風格特色：</strong><span id="detailFlavor"></span></p>
            <p><strong>材質與規格：</strong><span id="detailAllergen"></span></p>
          </div>
          
          <div>
            <!-- 書本/本子類專用尺寸與規格選擇 -->
            <div class="option-group" id="sizeGroup" style="display: none;">
              <label for="detailSize">選擇規格/尺寸：</label>
              <select id="detailSize">
                <option value="A5 標準款">A5 標準款</option>
                <option value="A6 隨身便攜款 (-100元)">A6 隨身便攜款 (-100元)</option>
              </select>
            </div>

            <!-- 數量選擇 -->
            <div class="option-group">
              <label for="detailQty">數量：</label>
              <input type="number" id="detailQty" value="1" min="1" max="99" />
            </div>

            <button class="btn" onclick="addToCart()">[加入購物車]</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 購物車清單 Modal -->
  <div class="modal" id="cartModal">
    <div class="modal-content">
      <div class="modal-header">
        <span>已選購商品清單</span>
        <button id="editCartBtn" class="edit-toggle-btn" onclick="toggleEditCart()">[編輯]</button>
      </div>
      <div id="cartItemsContainer"></div>
      
      <!-- 一般模式下顯示【確定】按鈕 -->
      <button class="btn" id="cartConfirmBtn" style="margin-top: 20px;" onclick="openCheckoutModal()">[確定]</button>
      <button class="btn btn-secondary" onclick="closeModal('cartModal')">繼續選購</button>
    </div>
  </div>

  <!-- 結帳填單 Modal -->
  <div class="modal" id="checkoutModal">
    <div class="modal-content">
      <div class="modal-header">
        <span>填寫訂購與配送資料</span>
      </div>
      <form id="checkoutForm" onsubmit="submitOrder(event)">
        <div class="form-group">
          <label>姓名 *</label>
          <input type="text" id="custName" required placeholder="請輸入收件人姓名" />
        </div>
        <div class="form-group">
          <label>手機 *</label>
          <input type="tel" id="custPhone" required placeholder="例：0912345678" oninput="validatePhone()" maxlength="10" />
          <div id="phoneError" class="error-text">手機格式錯誤，必須為 09 開頭之 10 碼數字</div>
        </div>
        <div class="form-group">
          <label>領貨/取件日期與時間 *</label>
          <input type="datetime-local" id="custPickupTime" required />
        </div>
        <div class="form-group">
          <label>外送/收件地址 *</label>
          <input type="text" id="custAddress" required placeholder="請輸入完整收件地址" />
        </div>
        <div class="form-group">
          <label>付款方式 *</label>
          <select id="custPayment" required>
            <option value="信用卡線上刷卡">信用卡線上刷卡</option>
            <option value="貨到付款">貨到付款</option>
            <option value="LINE Pay">LINE Pay</option>
            <option value="銀行轉帳">銀行轉帳</option>
          </select>
        </div>
        <div class="form-group">
          <label>備註</label>
          <textarea id="custNote" rows="2" placeholder="特殊包裝需求或指定注意事項..."></textarea>
        </div>

        <div class="total-amount" id="checkoutTotal">應付金額：NT$ 0</div>

        <button type="submit" class="btn">[送出訂單]</button>
        <button type="button" class="btn btn-secondary" onclick="closeModal('checkoutModal')">返回購物車</button>
      </form>
    </div>
  </div>

  <!-- 頁尾 -->
  <footer>
    <p>&copy; 2026 墨光行旅 獨立書店與手帳文具舖. All Rights Reserved.</p>
  </footer>

  <script>
    // 8款獨立書店與文具選品資料集（書籍類可選擇尺寸/規格）
    const products = [
      { id: 1, name: "《日常的微光》獨立攝影散文集", price: 580, category: "book", img: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=500&q=80", desc: "記錄城市角落與溫柔日常的獨立出版攝影集，附作者親簽藏書票。", flavor: "文藝、日常、溫暖", allergen: "100g 貝原紙、精裝本" },
      { id: 2, name: "手作布封皮一日一頁手帳本", price: 720, category: "book", img: "https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=500&q=80", desc: "採用日本巴川紙，180度完全攤平，適合鋼筆書寫不暈染。", flavor: "沉穩、實用、手感", allergen: "52g 巴川紙、布面精裝" },
      { id: 3, name: "《漫遊山林》詩文插畫選集", price: 450, category: "book", img: "https://images.unsplash.com/photo-1516979187457-637abb4f9353?auto=format&fit=crop&w=500&q=80", desc: "結合山林自然詩作與細膩水彩插畫的獨立Zine小誌。", flavor: "清新、療癒、自然", allergen: "厚磅美術紙、騎馬釘" },
      { id: 4, name: "復古皮革日誌與筆記本", price: 650, category: "book", img: "https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&w=500&q=80", desc: "義大利植鞣革手工製作外皮，內頁可替換式活頁設計。", flavor: "復古、率性、經久耐用", allergen: "植鞣牛皮、道林紙" },
      { id: 5, name: "真鍮黃銅製復古書籤筆組", price: 320, category: "other", img: "https://images.unsplash.com/photo-1583485088034-697b5bc54ccd?auto=format&fit=crop&w=500&q=80", desc: "越用越有歲月痕跡的黃銅書籤，兼具書寫與夾書功能。", flavor: "金屬質感、經年變化", allergen: "純黃銅材質" },
      { id: 6, name: "植鞣革手工鋼筆筆套", price: 380, category: "other", img: "https://images.unsplash.com/photo-1585336261022-6fc46059c402?auto=format&fit=crop&w=500&q=80", desc: "保護心愛鋼筆的隨身皮革筆套，職人手縫質感。", flavor: "職人工藝、溫潤手感", allergen: "頭層牛皮、蠟線" },
      { id: 7, name: "森林系和紙膠帶分裝禮盒", price: 280, category: "other", img: "https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&fit=crop&w=500&q=80", desc: "內含6款原創手繪森林與花草主題和紙膠帶，手帳裝飾必備。", flavor: "手帳拼貼、自然系", allergen: "和紙、特殊油墨" },
      { id: 8, name: "復古木質印章與印泥組", price: 420, category: "other", img: "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=500&q=80", desc: "經典排版日期與圖騰木章，為手帳蓋上細緻的時光印記。", flavor: "復古儀式感", allergen: "櫸木、橡膠、植物油印泥" }
    ];

    let currentProduct = null;
    let cart = []; 
    let isEditingCart = false; 

    function renderProductGrid() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = products.map(p => `
        <div class="product-card" onclick="openDetail(${p.id})">
          <div class="product-img-wrap">
            <img src="${p.img}" alt="${p.name}">
          </div>
          <div class="product-content">
            <h3>${p.name}</h3>
            <div class="product-footer">
              <span class="price">NT$ ${p.price}</span>
              <span class="view-detail-hint">查看詳情 →</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openDetail(productId) {
      currentProduct = products.find(p => p.id === productId);
      
      document.getElementById('detailImg').src = currentProduct.img;
      document.getElementById('detailName').innerText = currentProduct.name;
      document.getElementById('detailPrice').innerText = `NT$ ${currentProduct.price}`;
      document.getElementById('detailDesc').innerText = currentProduct.desc;
      document.getElementById('detailFlavor').innerText = currentProduct.flavor;
      document.getElementById('detailAllergen').innerText = currentProduct.allergen;
      document.getElementById('detailQty').value = 1;

      // 書本/手帳類顯示尺寸/規格選項
      const sizeGroup = document.getElementById('sizeGroup');
      if (currentProduct.category === 'book') {
        sizeGroup.style.display = 'block';
      } else {
        sizeGroup.style.display = 'none';
      }

      showPage('pageDetail');
    }

    function addToCart() {
      const qty = parseInt(document.getElementById('detailQty').value);
      if (!qty || qty < 1) return alert('請輸入有效的購買數量！');

      let size = "無";
      let unitPrice = currentProduct.price;

      if (currentProduct.category === 'book') {
        const sizeVal = document.getElementById('detailSize').value;
        if (sizeVal.includes('A6')) {
          size = 'A6 隨身便攜款';
          unitPrice -= 100;
        } else {
          size = 'A5 標準款';
        }
      }

      const existingIndex = cart.findIndex(item => item.id === currentProduct.id && item.size === size);
      
      if (existingIndex > -1) {
        cart[existingIndex].qty += qty;
      } else {
        cart.push({
          id: currentProduct.id,
          name: currentProduct.name,
          price: unitPrice,
          size: size,
          qty: qty
        });
      }

      updateCartBadge();
      alert('已成功加入購物車！');
      showPage('pageList');
    }

    function updateCartBadge() {
      const uniqueProductTypes = new Set(cart.map(item => item.id)).size;
      document.getElementById('cartBadge').innerText = uniqueProductTypes;
    }

    function openCartModal() {
      if (cart.length === 0) {
        alert('您的購物車是空的！');
        return;
      }
      isEditingCart = false;
      renderCartItems();
      document.getElementById('cartModal').classList.add('active');
    }

    function toggleEditCart() {
      isEditingCart = !isEditingCart;
      renderCartItems();
    }

    function renderCartItems() {
      const container = document.getElementById('cartItemsContainer');
      const editBtn = document.getElementById('editCartBtn');
      const confirmBtn = document.getElementById('cartConfirmBtn');

      if (isEditingCart) {
        editBtn.innerText = '[完成]';
        editBtn.classList.add('editing');
        confirmBtn.style.display = 'none';
      } else {
        editBtn.innerText = '[編輯]';
        editBtn.classList.remove('editing');
        confirmBtn.style.display = 'block';
      }

      if (cart.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 25px; color: #888;">購物車內已無商品</div>';
        confirmBtn.style.display = 'none';
        editBtn.style.display = 'none';
        return;
      } else {
        editBtn.style.display = 'inline-block';
      }

      container.innerHTML = cart.map((item, index) => {
        if (isEditingCart) {
          return `
            <div class="cart-item">
              <div style="display:flex; align-items:center;">
                <button class="delete-item-btn" onclick="removeItem(${index})">🗑️ 移除</button>
                <div>
                  <div class="cart-item-info">${item.name}</div>
                  <div class="cart-item-sub">規格: ${item.size} | 單價: $${item.price}</div>
                </div>
              </div>
              <div class="qty-controls">
                <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
                <span style="font-weight:bold; min-width: 20px; text-align:center;">${item.qty}</span>
                <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
              </div>
            </div>
          `;
        } else {
          return `
            <div class="cart-item">
              <div>
                <div class="cart-item-info">${item.name}</div>
                <div class="cart-item-sub">規格: ${item.size} | 單價: $${item.price}</div>
              </div>
              <div style="font-weight: 600;">x ${item.qty}</div>
            </div>
          `;
        }
      }).join('');
    }

    function changeQty(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) {
        if (confirm(`確定要移除「${cart[index].name}」嗎？`)) {
          cart.splice(index, 1);
        } else {
          cart[index].qty = 1;
        }
      }
      updateCartBadge();
      renderCartItems();
    }

    function removeItem(index) {
      if (confirm(`確定要移除「${cart[index].name}」嗎？`)) {
        cart.splice(index, 1);
        updateCartBadge();
        renderCartItems();
      }
    }

    function validatePhone() {
      const phoneInput = document.getElementById('custPhone');
      const errorDiv = document.getElementById('phoneError');
      const phoneVal = phoneInput.value.trim();
      const phoneRegex = /^09\d{8}$/;

      if (phoneVal === "") {
        errorDiv.style.display = 'none';
        return false;
      }

      if (!phoneRegex.test(phoneVal)) {
        errorDiv.style.display = 'block';
        return false;
      } else {
        errorDiv.style.display = 'none';
        return true;
      }
    }

    function openCheckoutModal() {
      if (cart.length === 0) return alert('購物車內無商品！');
      closeModal('cartModal');
      
      document.getElementById('checkoutForm').reset();
      document.getElementById('phoneError').style.display = 'none';

      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      document.getElementById('checkoutTotal').innerText = `應付金額：NT$ ${total}`;

      document.getElementById('checkoutModal').classList.add('active');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    function submitOrder(e) {
      e.preventDefault();

      if (!validatePhone()) {
        alert('請填寫正確的手機格式（09開頭之10碼數字）！');
        document.getElementById('custPhone').focus();
        return;
      }

      alert('已收到您的訂單申請，請等待段員確認!');

      cart = [];
      updateCartBadge();
      document.getElementById('checkoutForm').reset();
      closeModal('checkoutModal');
      showPage('pageList');
    }

    window.onload = function() {
      renderProductGrid();
    };
  </script>
</body>
</html>
